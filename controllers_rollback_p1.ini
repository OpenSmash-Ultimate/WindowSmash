; controllers_rollback_p1.ini: the controller settings of launchers\Rollback Netplay.bat on every PC, the host's and the
; joining ones' (SSBU_CONTROLLERS; your own controllers.ini is not used then). Your controller is player 1 here, and so is the
; keyboard (it adds to the controller, or plays alone). A joining PC's game moves them onto the player the host gives it; the
; other players' moves come from their PCs, the game keeps their slots connected by itself, each as the controller
; its player has: a GameCube controller plays as one on every PC (style = auto; version 12 says so in the choice),
; with its analog triggers and the GameCube controls, every other pad as a Pro Controller.
;
; controllers.ini: how pads become players. Read when the game starts; the settings menu (Esc,
; or the pad's Home / PS / Xbox button in the game) changes it too.
; Delete this file to get it written again with the defaults. A line starting with ';' is a comment.
;
; Any controller SDL3 knows works: Xbox, PlayStation, Switch Pro, GameCube (on Nintendo's adapter), and
; most others. Each new pad takes the lowest free player; a pad unplugged and plugged back in gets its
; player back. The game's log names every pad as it connects, e.g.
;   [input] player 2: "DualSense Wireless Controller" (ps5, GUID 050000004c050000e60c000000810000)

[general]
; keyboard_player = 1-8, or 0 for no keyboard. The keyboard adds to that player's pad.
keyboard_player = 1
; background = 1: pads work while the game's window is not focused. 0: only while it is.
background = 1
; rumble = 1: controllers rumble (each as strong as its own rumble below). 0: no controller rumbles.
rumble = 1

[players]
; Keep a player for one pad: <player> = <GUID, name or type of the pad>. Other pads leave it free.
; 2 = DualSense Wireless Controller

[device default]
; layout = positional: buttons by position, as on a Switch pad (the bottom face button is B).
;          labels: by the letter printed on the pad (an Xbox pad's A is A). PlayStation pads stay positional.
layout = positional
; style = auto: GameCube controllers play as GameCube controllers (the game's GameCube controls; buttons
;        by their letters, analog L and R), every other pad as a Pro Controller.
;        gamecube: play as a GameCube controller (the triggers are L and R, the bumpers Z). pro: Pro Controller.
style = auto
; deadzone = 0-50, percent of the stick's travel ignored around the centre. 0: only the game's own.
deadzone = 0
; rumble = 0-100, percent strength. 0: off.
rumble = 100
; trigger_threshold = 1-99, percent: how far a trigger is pulled to press ZL / ZR. (As a GameCube controller,
;                     the game itself decides how far L and R are pulled.)
trigger_threshold = 25
; Remap: <console button> = <pad control>[, <pad control> ...]
;   console buttons: A B X Y L R ZL ZR PLUS MINUS LSTICK RSTICK UP DOWN LEFT RIGHT
;   pad controls:    south east west north leftshoulder rightshoulder lefttrigger righttrigger start back
;                    guide leftstick rightstick dpup dpdown dpleft dpright misc1 leftpaddle1 rightpaddle1
;                    leftpaddle2 rightpaddle2 touchpad misc3 misc4 none
;   (a GameCube controller's Z is rightshoulder; misc3 and misc4 are the clicks at the bottom of L and R)
; ZR = rightshoulder
; R = righttrigger

; Settings for one kind of pad, or one pad: [device <type, name or GUID>], with the keys above.
; Types: xbox360 xboxone ps3 ps4 ps5 switchpro joyconpair gamecube ...
; [device ps5]
; rumble = 60

[device Nintendo GameCube Controller]
A = south
L = lefttrigger
R = righttrigger
ZR = rightshoulder
PLUS = start
UP = dpup
DOWN = dpdown
LEFT = dpleft
Y = north
X = east
B = west

; The GameCube adapter in PC mode (through SDL), whose C stick SDL reads backwards. (In Wii U mode it has another GUID.)
[device 03004271790000004318000000016800]
invert_rightstick = 1

; (added 2026-10-30 for the rollback tests: the Xbox pad plays player 2, a bot, and must not rumble)
[device xboxone]
rumble = 0
